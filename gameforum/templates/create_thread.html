
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Discussion - GameForum</title>
</head>
<body>
    <h1>Create a Discussion</h1>

    <!-- Display validation errors -->
    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <form method="POST" action="/threads/new">

        <label for="title">Title:</label>
        <input type="text" id="title" name="title"
               maxlength="120" required>

        <label for="category">Category:</label>
        <select id="category" name="category" required>
            <option value="">Select a category</option>

            <!-- Display the available gaming categories -->
            {% for category in categories %}
                <option value="{{ category }}">{{ category }}</option>
            {% endfor %}
        </select>

        <label for="content">Content:</label>
        <textarea id="content" name="content" maxlength="2000" required></textarea>

        <button type="submit">Create Discussion</button>
    </form>

    <p><a href="/">Back to GameForum</a></p>
</body>
</html>
