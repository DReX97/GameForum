
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - GameForum</title>
</head>
<body>
    <h1>Create an Account</h1>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    {% if registered %}
        <p>Registration successful!</p>
    {% endif %}

    <form method="POST" action="/register">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password"minlength="15" required>

        <button type="submit">Register</button>
    </form>

    <p><a href="/">Back to GameForum</a></p>
</body>
</html>
